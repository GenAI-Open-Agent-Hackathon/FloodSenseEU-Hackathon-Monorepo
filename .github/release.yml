# Groups for GitHub's automatically generated release notes.
# A merged pull request is listed under the first category whose label it carries.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
      - github-actions[bot]
      - renovate[bot]
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Docs & ADRs
      labels:
        - documentation
    - title: CI & Tooling
      labels:
        - ci
    - title: Other
      labels:
        - "*"
