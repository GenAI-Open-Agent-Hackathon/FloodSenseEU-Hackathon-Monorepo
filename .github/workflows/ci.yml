name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, test, secrets
    # Single runner switch.
    # The homelab runner is registered with labels self-hosted and homelab.
    # It is a 512Mi container, it may not have Python or Node, and it likely
    # has no Docker. This job does not call Zetaris or Nightshift, and it does
    # not use Docker. GitHub-hosted ubuntu-latest has the memory for npm ci.
    # To move every step, replace the next line with:
    # runs-on: [self-hosted, homelab]
    # The gitleaks install step needs bash, curl, and tar. setup-python and
    # setup-node need a runner that can run Node 24 actions (runner v2.327.1
    # or newer). The homelab runner's version and memory were not measured.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Release binary, not gitleaks/gitleaks-action. That action's README
      # says organization accounts need GITLEAKS_LICENSE. This repository is
      # under an organization. The binary also does not need Docker.
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          tmp="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${tmp}" "${HOME}/.local/bin"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/gitleaks_${version}_checksums.txt"
          grep " ${archive}$" "${tmp}/checksums.txt" > "${tmp}/wanted.txt"
          cd "${tmp}"
          sha256sum -c wanted.txt
          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt -r agents/requirements.txt -r contracts/requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        env:
          FLOODSENSE_REQUIRE_GITLEAKS: "1"
        run: python tasks.py lint

      - name: Test
        run: python tasks.py test
