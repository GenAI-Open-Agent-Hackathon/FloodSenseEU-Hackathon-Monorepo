# compose.yaml — runs OUR app only.
# It never starts, stops, joins, or modifies a Zetaris stack.
# Do not add a Zetaris service, image, volume, network, or container_name.
# Run `python tasks.py down` in this repo. Do not docker system prune or docker volume prune.
#
# `name` below is not enough on its own: an exported COMPOSE_PROJECT_NAME
# overrides it. tasks.py always passes `-p floodsense-app`, which wins.
# It also passes `--project-directory` and `-f` so COMPOSE_FILE cannot
# select another file. env_file `required: false` needs Compose v2.24+.
# A missing file must not block `down` (the rag profile is optional).
# `up` still refuses to start until api/.env, agents/.env, and ui/.env exist.
# engines/.env is optional. The engines service overrides host, port, and
# data dir so a laptop file that binds 127.0.0.1 cannot hide the port.

name: floodsense-app

services:
  api:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    # Do not set REDIS_URL here. A value in this block, even an empty one,
    # overwrites api/.env. The cache URL belongs in api/.env.
    environment:
      AGENTS_URL: http://agents:8100
      # Read-only: GET /system lists H-MEM and the World Model; demo-seed stores through it.
      ENGINES_URL: http://engines:8300
    ports:
      - "127.0.0.1:${FLOODSENSE_API_PORT:-18000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agents
    networks:
      - floodsense

  agents:
    build: ./agents
    env_file:
      - path: ./agents/.env
        required: false
    # Compose `environment` wins over agents/.env. On the host, without
    # compose, ENGINES_URL is http://127.0.0.1:8300 (the published port).
    environment:
      ENGINES_URL: http://engines:8300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - checkpoints:/data/checkpoints
    depends_on:
      - engines
    networks:
      - floodsense

  engines:
    build: ./engines
    env_file:
      - path: ./engines/.env
        required: false
    # A laptop engines/.env sets ENGINES_HOST=127.0.0.1. That address inside
    # this container is not reachable from the agents service. These three
    # values override the file. The host port below stays on loopback.
    environment:
      ENGINES_HOST: 0.0.0.0
      ENGINES_PORT: "8300"
      ENGINES_DATA_DIR: /data
    ports:
      - "127.0.0.1:${FLOODSENSE_ENGINES_PORT:-8300}:8300"
    volumes:
      - engines-data:/data
    networks:
      - floodsense

  ui:
    build: ./ui
    env_file:
      - path: ./ui/.env
        required: false
    ports:
      - "127.0.0.1:${FLOODSENSE_UI_PORT:-15173}:5173"
    depends_on:
      - api
    networks:
      - floodsense

  # Live German gauges. Replaces `python tasks.py pegel-poll --interval 600` on a host.
  # It reaches the separate Zetaris stack only through `docker cp` / `docker exec` on the
  # driver container, so it needs the Docker socket (Linux; Docker Desktop on Windows and
  # macOS expose the same path inside containers). It joins no Zetaris network and has no
  # keys or .env. Default profile: `up` and `up-all` both start it.
  pegel-poller:
    build: ./ingestion/feeds
    environment:
      ZETARIS_CONTAINER: ${ZETARIS_CONTAINER:-zetaris-driver-1}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-600}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "pegel_poll.py", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - floodsense

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["rag"]
    env_file:
      - path: ./pgvector/.env
        required: false
    ports:
      - "127.0.0.1:${FLOODSENSE_PGVECTOR_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - floodsense

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    # No password. The host port stays on loopback so it is not on the LAN.
    ports:
      - "127.0.0.1:${FLOODSENSE_REDIS_PORT:-16379}:6379"
    networks:
      - floodsense

networks:
  floodsense:
    name: floodsense-app-net

# Explicit names so a wrong project name cannot create zetaris-stack_* volumes.
volumes:
  checkpoints:
    name: floodsense-app_checkpoints
  engines-data:
    name: floodsense-app_engines
  pgdata:
    name: floodsense-app_pgdata
