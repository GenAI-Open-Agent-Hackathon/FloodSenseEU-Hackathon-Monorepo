# compose.yaml — runs OUR app only.
# It never starts, stops, joins, or modifies a Zetaris stack.
# Do not add a Zetaris service, image, volume, network, or container_name.
# Run `make down` in this repo. Do not docker system prune or docker volume prune.

name: floodsense-app

services:
  api:
    build: ./api
    env_file: ./api/.env
    environment:
      AGENTS_URL: http://agents:8100
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "${FLOODSENSE_API_PORT:-18000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agents
    networks:
      - floodsense

  agents:
    build: ./agents
    env_file: ./agents/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - checkpoints:/data/checkpoints
    networks:
      - floodsense

  ui:
    build: ./ui
    env_file: ./ui/.env
    ports:
      - "${FLOODSENSE_UI_PORT:-15173}:5173"
    depends_on:
      - api
    networks:
      - floodsense

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: ["rag"]
    env_file: ./pgvector/.env
    ports:
      - "${FLOODSENSE_PGVECTOR_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - floodsense

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "${FLOODSENSE_REDIS_PORT:-16379}:6379"
    networks:
      - floodsense

networks:
  floodsense:
    name: floodsense-app-net

volumes:
  checkpoints:
  pgdata:
