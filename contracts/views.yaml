# Column names and types for Zetaris views.
# floodsense.<name> and floodsense_seed.<name> share one entry.
# Migration headers (-- view: / -- columns: / -- min_rows:) must match this file.
# scripts/tests/test_migration_contract.py reads "  <view>:" and "- {name: ..., type: ...}".

views:
  # min_rows: 136 (live and seed; 8 points, 2024-10-20 through 2024-11-05)
  discharge_daily:
    - {name: point_id, type: string}
    - {name: date, type: date}
    - {name: discharge_m3s, type: double}
    - {name: source, type: string}
  # min_rows: live 3264, seed 576
  hazard_timeline:
    - {name: point_id, type: string}
    - {name: ts_utc, type: timestamp}
    - {name: rain_mm, type: double}
    - {name: discharge_m3s, type: double}
    - {name: warning_level, type: string}
  # min_rows: live 1152 (8 points x 144 hours, rolling), seed 576. Same columns as hazard_timeline.
  hazard_now:
    - {name: point_id, type: string}
    - {name: ts_utc, type: timestamp}
    - {name: rain_mm, type: double}
    - {name: discharge_m3s, type: double}
    - {name: warning_level, type: string}
  # min_rows: 359 (live and seed). synthetic is the portfolio flag (yes). Not a live book.
  # Migration 018 is the column list verify checks once it is applied. 014 and 016 create the view first.
  exposure_join:
    - {name: policy_id, type: string}
    - {name: site_id, type: string}
    - {name: lat, type: double}
    - {name: lon, type: double}
    - {name: in_footprint, type: boolean}
    - {name: sum_insured_eur, type: double}
    - {name: segment, type: string}
    - {name: synthetic, type: string}
  # min_rows: 7 cleared datasets. ds_dwd_brightsky stays in the CSV and is filtered out of the views.
  provenance:
    - {name: dataset, type: string}
    - {name: source_url, type: string}
    - {name: publisher, type: string}
    - {name: licence, type: string}
    - {name: attribution, type: string}
    - {name: fetched_at, type: timestamp}
